<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>詩詞拼圖 - 夜雨寄北</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; background-color: #fdf6e3; margin: 0; min-height: 100vh; position: relative; overflow-x: hidden; box-sizing: border-box; }
        .full-width { width: 100%; max-width: 600px; text-align: center; margin-top: 5px; }
        
        #timer { 
            position: fixed; top: 15px; right: 15px; font-size: 18px; font-weight: bold; 
            color: #8b4513; background: white; padding: 5px 10px; border-radius: 10px; 
            border: 2px solid #8b4513; z-index: 1000;
        }

        h2 { color: #8b4513; margin: 8px 0; font-size: 22px; }
        
        .action-container { margin: 8px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .yt-link { text-decoration: none; padding: 6px 12px; background: #FF0000; color: white; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .preview-btn { padding: 6px 12px; background: #5c6bc0; color: white; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; }
        
        .grid-container { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 10px 0; align-items: center; }
        .slot { width: 30px; height: 30px; border: 2px dashed #8b4513; display: flex; align-items: center; justify-content: center; background-color: #fff; border-radius: 6px; font-weight: bold; font-size: 15px; color: #333; }
        
        .punctuation { font-size: 16px; font-weight: bold; color: #5d6d7e; margin: 0 1px; }
        .instruction { color: #5d6d7e; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        
        #tetris-container {
            width: 100%; max-width: 100%; height: 120px; background-color: #ffffff;
            border-radius: 8px; position: relative; overflow: hidden; margin-top: 5px;
            border: 2px solid #8b4513; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tetris-block {
            position: absolute; display: flex; gap: 6px; justify-content: center; left: 50%;
            transform: translateX(-50%); transition: top 0.05s linear; width: 95%;
        }

        .tetris-word {
            width: 40px; height: 48px; background-color: #8b4513; color: #ffffff;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-size: 20px; font-weight: bold; border-radius: 8px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2); user-select: none; flex-shrink: 0;
        }
        .tetris-word:hover { background-color: #a0522d; }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .action-btn { padding: 8px 18px; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; font-weight: bold; }
        #undo-btn { background: #f39c12; color: white; }
        #reset-btn { background: #ff5722; color: white; display: none; }

        /* 首頁樣式優化 */
        #home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 10px; width: 100%; box-sizing: border-box; }
        #home-screen h1 { color: #8b4513; font-size: 26px; margin-bottom: 10px; }
        .poetry-display { 
            background: #fffaf0; border: 2px solid #d2b48c; padding: 15px; border-radius: 10px; 
            margin: 20px 0; font-size: 18px; line-height: 2; color: #5d4037; font-weight: bold; 
            width: 90%; max-width: 350px; white-space: pre-line; word-wrap: break-word; text-align: center;
        }
        .start-btn { padding: 15px 30px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .start-btn:hover { background-color: #219653; }
        
        #game-screen { display: none; width: 100%; }
        #explanation { display: none; margin-top: 15px; padding: 15px; background: #fff; border: 1px solid #8b4513; border-radius: 8px; color: #8b4513; font-size: 16px; line-height: 1.6; text-align: left; }

        @media screen and (max-width: 400px) {
            .tetris-word { width: 34px; height: 42px; font-size: 17px; }
            .slot { width: 26px; height: 26px; font-size: 13px; }
            .punctuation { font-size: 14px; }
        }
    </style>
</head>
<body>

<div id="timer">時間：00:00</div>

<div id="home-screen" class="full-width">
    <h1>📜 詩詞拼圖遊戲</h1>
    <p class="instruction" style="font-size: 18px;">李商隱：夜雨寄北</p>
    
    <div class="poetry-display">
        君問歸期未有期，
        巴山夜雨漲秋池。
        何當共剪西窗燭，
        卻話巴山夜雨時。
    </div>

    <button class="start-btn" onclick="startGame()">開始遊戲</button>
</div>

<div id="game-screen" class="full-width">
    <h2>李商隱：夜雨寄北</h2>
    
    <div class="action-container">
        <a href="https://youtube.com/shorts/fbO4NoMXRC4" target="_blank" class="yt-link">🎥 觀看複習影片</a>
        <button class="preview-btn" onclick="showPreview()">📖 查看全文</button>
    </div>

    <div class="instruction">請點選下方框框裡的字，正確的字會出現在上方的空格中</div>

    <div id="slots" class="grid-container"></div>
    <div id="tetris-container"></div>
    <div id="explanation"></div>
    
    <div class="btn-group">
        <button id="undo-btn" class="action-btn" onclick="undoLast()">⟲ 更正</button>
        <button id="reset-btn" class="action-btn" onclick="resetGame()">再玩一次</button>
    </div>
</div>

<script>
    const fullText = "君問歸期未有期，巴山夜雨漲秋池。何當共剪西窗燭，卻話巴山夜雨時(李商隱)(夜雨寄北)";
    const explainText = "【全文解釋】<br>你問我回家的日期，歸期實在沒有個準期；今晚巴山夜雨綿綿，池水已經漲滿了。何時才能跟你一同在西窗下剪燭夜談，再細細訴說今日巴山夜雨時的情景呢？";
    const puncRegex = /[，。()：]/; 
    
    // ... 原有的 JavaScript 邏輯保持不變 ...
    function startGame() {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        initGame();
    }
    // ... (後續函數請維持您原本提供的內容即可) ...
</script>
</body>
</html>
