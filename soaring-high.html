<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>詩詞拼圖 - 獨坐敬亭山(李白)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Microsoft JhengHei', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 5px 10px; background-color: #fdf6e3; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .full-width { width: 100%; max-width: 600px; text-align: center; }
        
        #timer { position: fixed; top: 12px; right: 12px; font-size: 16px; font-weight: bold; color: #8b4513; background: white; padding: 4px 8px; border-radius: 8px; border: 2px solid #8b4513; z-index: 1000; }
        h2 { color: #8b4513; margin: 6px 0; font-size: 20px; }
        
        .action-container { margin: 6px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .yt-link { text-decoration: none; padding: 5px 10px; background: #FF0000; color: white; border-radius: 5px; font-size: 13px; font-weight: bold; }
        .preview-btn { padding: 5px 10px; background: #5c6bc0; color: white; border: none; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        .grid-container { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin: 6px 0; align-items: center; }
        .slot { width: 24px; height: 24px; border: 2px dashed #8b4513; display: flex; align-items: center; justify-content: center; background-color: #fff; border-radius: 5px; font-weight: bold; font-size: 12px; color: #333; }
        .punctuation { font-size: 13px; font-weight: bold; color: #5d6d7e; margin: 0 1px; display: flex; align-items: center; }
        .instruction { color: #5d6d7e; margin-bottom: 6px; font-weight: bold; font-size: 13px; }
        
        #tetris-container { width: 100%; max-width: 100%; height: 100px; background-color: #ffffff; border-radius: 8px; position: relative; overflow: hidden; margin-top: 5px; border: 2px solid #8b4513; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tetris-block { position: absolute; display: flex; gap: 4px; justify-content: center; left: 50%; transform: translateX(-50%); width: 95%; flex-wrap: wrap; }
        .tetris-word { width: 34px; height: 40px; background-color: #8b4513; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 6px; box-shadow: 2px 2px 4px rgba(0,0,0,0.2); user-select: none; flex-shrink: 0; }
        
        .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
        .action-btn { padding: 7px 16px; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; font-weight: bold; }
        #undo-btn { background: #f39c12; color: white; }
        #reset-btn { background: #ff5722; color: white; display: none; }

        /* 雙頁切換首頁設計：靠上緊湊對齊，消除上方過多留白 */
        .page-container { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 10px 0; min-height: 85vh; text-align: center; width: 100%; }
        .page-container h1 { color: #8b4513; font-size: 22px; margin: 2px 0; }
        
        /* 統一的詩詞與翻譯卡片樣式：自適應高度，絕不切掉文字 */
        .content-card { 
            background: #fff8dc; 
            padding: 12px 18px; 
            border-radius: 10px; 
            border: 2px solid #8b4513; 
            margin: 6px auto; 
            font-family: "KaiTi", "BiauKai", "STKaiti", "Microsoft JhengHei", serif; 
            font-size: 18px; 
            line-height: 1.8; 
            color: #2c1d0c; 
            font-weight: bold; 
            letter-spacing: 1px; 
            width: 92%; 
            max-width: 450px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            text-align: left;
            height: auto; 
            white-space: pre-line;
        }

        /* 底部按鈕左右並排群組 */
        .home-btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 92%;
            max-width: 450px;
            margin-top: 8px;
        }

        .home-btn-row button {
            flex: 1;
            padding: 10px 4px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        .translate-btn { background-color: #e67e22; }
        .translate-btn:hover { background-color: #d35400; }
        
        .start-btn { background-color: #27ae60; }
        .start-btn:hover { background-color: #219653; }
        
        #game-screen { display: none; width: 100%; }
        #explanation { display: none; margin-top: 10px; padding: 12px; background: #fff; border: 1px solid #8b4513; border-radius: 8px; color: #8b4513; font-size: 14px; line-height: 1.5; text-align: left; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

<div id="timer">時間：00:00</div>

<!-- 【第一頁：詩詞全文首頁】 -->
<div id="home-page-1" class="full-width page-container">
    <h1>📜 詩詞拼圖遊戲</h1>
    <p style="color: #8b4513; font-weight: bold; font-size: 15px; margin: 2px 0 4px 0;">李白：獨坐敬亭山</p>
    
    <div class="content-card">
眾鳥高飛盡，
孤雲獨去閒。
相看兩不厭，
只有敬亭山。
    </div>

    <div class="home-btn-row">
        <button class="translate-btn" onclick="showPage(2)">觀看翻譯</button>
        <button class="start-btn" onclick="startGame()">開始遊戲</button>
    </div>
</div>

<!-- 【第二頁：翻譯內容首頁】 -->
<div id="home-page-2" class="full-width page-container" style="display: none;">
    <h1>📜 詩詞拼圖遊戲</h1>
    <p style="color: #8b4513; font-weight: bold; font-size: 15px; margin: 2px 0 4px 0;">李白：獨坐敬亭山 (翻譯與賞析)</p>
    
    <div class="content-card" style="font-family: 'Microsoft JhengHei', sans-serif; font-size: 14px; line-height: 1.6;">
        <strong>【全文解釋】</strong><br>
        群鳥高高飛去不見蹤影，孤雲獨自飄遊也漸漸遠去。<br>
        彼此相看而不感到厭倦的，只有我和這座敬亭山。<br>
        寂靜超然，人山相望，寄託孤獨中的自在與心靈相契。
    </div>

    <div class="home-btn-row">
        <button class="translate-btn" onclick="showPage(1)">觀看詩詞全文</button>
        <button class="start-btn" onclick="startGame()">開始遊戲</button>
    </div>
</div>

<!-- 【遊戲主畫面】 -->
<div id="game-screen" class="full-width">
    <h2>獨坐敬亭山</h2>
    <div class="action-container">
        <a href="https://youtube.com/shorts/B5h3H5L5AjY" target="_blank" class="yt-link">🎥 觀看複習影片</a>
        <button class="preview-btn" onclick="showPreview()">📖 查看全文</button>
    </div>
    <div class="instruction">請點選下方框框裡的字，正確的字會出現在上方的空格中</div>
    <div id="slots" class="grid-container"></div>
    <div id="tetris-container"></div>
    <div id="explanation"></div>
    <div class="btn-group">
        <button id="undo-btn" class="action-btn" onclick="undoLast()">⟲ 更正</button>
        <button id="reset-btn" class="action-btn" onclick="resetGame()">再玩一次</button>
        <button class="action-btn" style="background: #7f8c8d; color: white;" onclick="goHome()">🏠 回首頁</button>
    </div>
</div>

<script>
    const fullText = "眾鳥高飛盡，孤雲獨去閒。相看兩不厭，只有敬亭山。(獨坐敬亭山)(李白)(唐)";
    const explainText = "【全文解釋】<br>群鳥高高飛去不見蹤影，孤雲獨自飄遊也漸漸遠去。彼此相看而不感到厭倦的，只有我和這座敬亭山。<br>寂靜超然，人山相望，寄託孤獨中的自在與心靈相契。";
    const puncRegex = /[，。()]/; 
    
    let blocksData = [], activeBlock = null, gameInterval = null, seconds = 0, timerStarted = false, timerInterval = null;

    function showPage(pageNum) {
        if (pageNum === 1) {
            document.getElementById('home-page-1').style.display = 'flex';
            document.getElementById('home-page-2').style.display = 'none';
        } else {
            document.getElementById('home-page-1').style.display = 'none';
            document.getElementById('home-page-2').style.display = 'flex';
        }
    }

    function safeSpeak(text) {
        setTimeout(() => {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    let msg = new SpeechSynthesisUtterance(text);
                    msg.lang = 'zh-TW';
                    window.speechSynthesis.speak(msg);
                }
            } catch (e) { console.log("語音播放略過:", e); }
        }, 50);
    }

    function startGame() {
        safeSpeak("開始囉！");
        document.getElementById('home-page-1').style.display = 'none';
        document.getElementById('home-page-2').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        initGame();
    }

    function goHome() {
        if (gameInterval) clearInterval(gameInterval);
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('game-screen').style.display = 'none';
        showPage(1);
    }

    function initGame() {
        clearInterval(timerInterval); seconds = 0; timerStarted = false;
        document.getElementById('timer').innerText = "時間：00:00";
        const slotsDiv = document.getElementById('slots'); slotsDiv.innerHTML = '';
        fullText.split('').forEach((char) => {
            if (puncRegex.test(char)) {
                let punc = document.createElement('span'); punc.className = 'punctuation'; punc.textContent = char; slotsDiv.appendChild(punc);
            } else {
                let slot = document.createElement('div'); slot.className = 'slot empty-slot'; slot.dataset.char = char; slotsDiv.appendChild(slot);
            }
        });
        const options = fullText.split('').filter(c => !puncRegex.test(c));
        blocksData = [];
        for (let i = 0; i < options.length; i += 7) {
            let b = options.slice(i, i + 7); b.sort(() => Math.random() - 0.5); 
            blocksData.push(b);
        }
        spawnNextBlock();
    }

    function spawnNextBlock() {
        if (blocksData.length === 0) return;
        const container = document.getElementById('tetris-container'); container.innerHTML = ''; 
        let chars = blocksData.shift();
        let blockDiv = document.createElement('div'); blockDiv.className = 'tetris-block';
        
        renderCharsToBlock(blockDiv, chars);
        container.appendChild(blockDiv);
        
        activeBlock = { element: blockDiv, chars: chars };
        let top = -60; clearInterval(gameInterval);
        gameInterval = setInterval(() => { 
            if (top < 30) { top += 4; blockDiv.style.top = top + 'px'; } 
            else { clearInterval(gameInterval); } 
        }, 30);
    }

    function renderCharsToBlock(blockDiv, chars) {
        blockDiv.innerHTML = '';
        chars.forEach(char => {
            let wordDiv = document.createElement('div'); wordDiv.className = 'tetris-word'; wordDiv.textContent = char;
            wordDiv.addEventListener('click', (e) => handleWordClick(e, char, wordDiv, chars, blockDiv));
            wordDiv.addEventListener('touchend', (e) => handleWordClick(e, char, wordDiv, chars, blockDiv));
            blockDiv.appendChild(wordDiv);
        });
    }

    function handleWordClick(e, char, wordDiv, chars, blockDiv) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        startTimerIfNeeded();
        let target = document.querySelector('.empty-slot:not([id="filled"])');
        if (target && char === target.dataset.char) {
            target.textContent = char; target.id = "filled"; target.style.backgroundColor = "#fff";
            chars.splice(chars.indexOf(char), 1);
            if (chars.length === 0) { clearInterval(gameInterval); blockDiv.remove(); activeBlock = null; spawnNextBlock(); }
            else { renderCharsToBlock(blockDiv, chars); }
            if (!document.querySelector('.empty-slot:not([id="filled"])')) finish();
        }
    }

    function undoLast() {
        const filled = document.querySelectorAll('.slot[id="filled"]');
        if (filled.length > 0) {
            const lastSlot = filled[filled.length - 1];
            const char = lastSlot.dataset.char;
            lastSlot.textContent = ""; lastSlot.removeAttribute('id'); lastSlot.style.backgroundColor = "#fff";
            if (activeBlock) { activeBlock.chars.push(char); renderCharsToBlock(activeBlock.element, activeBlock.chars); }
            else { blocksData.push([char]); spawnNextBlock(); }
        }
    }

    function showPreview() {
        const slots = document.querySelectorAll('.empty-slot');
        slots.forEach(s => { if (s.id !== "filled") { s.textContent = s.dataset.char; s.style.backgroundColor = "#e0d0b0"; } });
        setTimeout(() => { slots.forEach(s => { if (s.id !== "filled") { s.textContent = ""; s.style.backgroundColor = "#fff"; } }); }, 3000); 
    }

    function startTimerIfNeeded() {
        if (!timerStarted) {
            timerStarted = true;
            timerInterval = setInterval(() => { 
                seconds++; 
                document.getElementById('timer').innerText = `時間：${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`; 
            }, 1000);
        }
    }

    function resetGame() {
        if (gameInterval) clearInterval(gameInterval);
        if (timerInterval) clearInterval(timerInterval);
        seconds = 0; timerStarted = false;
        document.getElementById('timer').innerText = "時間：00:00";
        document.getElementById('explanation').style.display = 'none';
        
        document.getElementById('tetris-container').style.display = 'block';
        document.getElementById('reset-btn').style.display = 'none';
        document.getElementById('undo-btn').style.display = 'inline-block';
        if (activeBlock && activeBlock.element) activeBlock.element.remove();
        initGame();
    }

    function finish() {
        clearInterval(gameInterval); clearInterval(timerInterval);
        if (activeBlock && activeBlock.element) activeBlock.element.remove();
        safeSpeak("太棒了");
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        document.getElementById('explanation').innerHTML = explainText;
        document.getElementById('explanation').style.display = 'block';
        document.getElementById('reset-btn').style.display = 'inline-block';
        document.getElementById('undo-btn').style.display = 'none';
        document.getElementById('tetris-container').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const undoBtn = document.getElementById('undo-btn');
        const resetBtn = document.getElementById('reset-btn');
        const previewBtn = document.getElementById('preview-btn');

        if (undoBtn) {
            undoBtn.addEventListener('click', (e) => { e.preventDefault(); undoLast(); });
            undoBtn.addEventListener('touchend', (e) => { e.preventDefault(); undoLast(); });
        }
        if (resetBtn) {
            resetBtn.addEventListener('click', () => location.reload());
            resetBtn.addEventListener('touchend', () => location.reload());
        }
        if (previewBtn) {
            previewBtn.addEventListener('click', (e) => { e.preventDefault(); showPreview(); });
            previewBtn.addEventListener('touchend', (e) => { e.preventDefault(); showPreview(); });
        }
    });
</script>
</body>
</html>
