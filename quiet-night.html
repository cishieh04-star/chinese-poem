<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>古詩拼圖 - 靜夜思(李白)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 15px; background-color: #fdf6e3; margin: 0; min-height: 100vh; }
        .full-width { width: 100%; max-width: 600px; text-align: center; margin-top: 20px; }
        
        #timer-display { position: fixed; top: 10px; right: 10px; font-size: 16px; font-weight: bold; color: #d32f2f; background: rgba(255, 255, 255, 0.9); padding: 5px 8px; border-radius: 6px; border: 1px solid #8b4513; z-index: 1000; }
        
        h2 { color: #8b4513; margin: 10px 0; }
        
        .btn-wrapper { margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
        .action-btn { padding: 10px 25px; font-size: 16px; background: #5c6bc0; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .grid-container { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 20px 0; }
        .slot { width: 32px; height: 32px; border: 2px dashed #8b4513; display: flex; align-items: center; justify-content: center; background-color: #fff; border-radius: 6px; font-weight: bold; font-size: 16px; transition: background-color 0.3s; }
        .punctuation { font-size: 18px; font-weight: bold; color: #5d6d7e; margin: 0 2px; line-height: 32px; }
        .instruction { color: #5d6d7e; margin-bottom: 8px; font-weight: bold; font-size: 15px; }
        
        .word { padding: 8px 12px; background-color: #8b4513; color: #ffffff; cursor: pointer; border-radius: 6px; margin: 3px; font-weight: bold; }
        .hidden { display: none; }
        
        #translation { margin-top: 20px; padding: 15px; background: #f0e6d2; border-radius: 8px; text-align: left; font-size: 14px; line-height: 1.8; color: #5d4037; display: none; }
        #reset-btn { margin-top: 20px; padding: 10px 25px; background: #ff5722; color: white; border: none; border-radius: 5px; display: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="timer-display">時間: 00:00</div>

<div class="full-width">
    <h2>李白 - 靜夜思</h2>
    
    <div class="btn-wrapper">
        <a href="https://www.youtube.com/watch?v=UxZ8ofmODTg" target="_blank" style="text-decoration:none;">
            <button class="action-btn" style="background:#e53935;">觀看影片</button>
        </a>
        <button class="action-btn" onclick="showPreview()">觀看全文</button>
    </div>

    <div class="instruction">請點選下方框框裡的字，正確的字會出現在上方的空格中</div>

    <div id="slots" class="grid-container"></div>
    <div id="word-pool" style="display:flex; flex-wrap:wrap; justify-content:center;"></div>
    
    <button id="reset-btn" onclick="location.reload()">再玩一次</button>
    
    <div id="translation"></div>
</div>

<script>
    const fullText = "牀前明月光，疑是地上霜。舉頭望明月，低頭思故鄉。(靜夜思)(李白)";
    const explainText = "【全文解釋】<br>這首詩描寫了詩人在客途中的思鄉之情。詩人在首句寫月色照前來，說明詩人夜深仍未入睡，已暗寓了思鄉之情。用「霜」來比喻月光，古已有之，第二句寫詩人「疑」月為「霜」，聯想西北故鄉的苦寒，意思更深一層，由此可見詩人推陳出新之妙。<br><br>末兩句從「舉頭」到「低頭」，表現了詩人複雜的心理活動。抬頭望月，上句的懷疑消失，而下句的思鄉之情油然而生，轉折自然。全篇主題是「思鄉」，卻先以三句寫月，鄉情已蘊含其中；待到點明主題，詩便戛然而止，留給讀者想像的空間。這首短詩明白如話，不假雕飾，但意味深長，因此傳頌千古，婦孺皆知。";
    const puncRegex = /[，。()]/;
    let timerInterval, seconds = 0, timerStarted = false;

    function startTimer() {
        if (!timerStarted) {
            timerStarted = true;
            timerInterval = setInterval(() => {
                seconds++;
                let m = Math.floor(seconds / 60).toString().padStart(2, '0');
                let s = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('timer-display').textContent = `時間: ${m}:${s}`;
            }, 1000);
        }
    }

    function showPreview() {
        const slots = document.querySelectorAll('.empty-slot');
        slots.forEach(slot => { 
            if(slot.id !== "filled") {
                slot.textContent = slot.dataset.char;
                slot.style.backgroundColor = "#e0d0b0";
            }
        });
        setTimeout(() => {
            slots.forEach(slot => { 
                if(slot.id !== "filled") {
                    slot.textContent = ""; 
                    slot.style.backgroundColor = "#fff";
                }
            });
        }, 3000);
    }

    function initGame() {
        const slotsDiv = document.getElementById('slots');
        const pool = document.getElementById('word-pool');
        const chars = fullText.split('');

        chars.forEach(char => {
            if (puncRegex.test(char)) {
                let p = document.createElement('span');
                p.className = 'punctuation';
                p.textContent = char;
                slotsDiv.appendChild(p);
            } else {
                let slot = document.createElement('div');
                slot.className = 'slot empty-slot';
                slot.dataset.char = char;
                slotsDiv.appendChild(slot);
            }
        });

        const wordsOnly = chars.filter(c => !puncRegex.test(c));
        let shuffled = [...wordsOnly].sort(() => Math.random() - 0.5);

        shuffled.forEach(char => {
            let div = document.createElement('div');
            div.className = 'word';
            div.textContent = char;
            div.onclick = function() {
                startTimer();
                let target = document.querySelector('.empty-slot:not([id="filled"])');
                if (target && this.textContent === target.dataset.char) {
                    target.textContent = this.textContent;
                    target.id = "filled";
                    target.style.backgroundColor = "#fff";
                    this.className = 'hidden';
                    if (!document.querySelector('.empty-slot:not([id="filled"])')) finish();
                }
            };
            pool.appendChild(div);
        });
    }

    function finish() {
        clearInterval(timerInterval);
        const msg = new SpeechSynthesisUtterance("太棒了");
        msg.lang = 'zh-TW';
        window.speechSynthesis.speak(msg);
        confetti({ particleCount: 150, spread: 70 });
        
        document.getElementById('reset-btn').style.display = 'inline-block';
        document.getElementById('word-pool').style.display = 'none';
        const trans = document.getElementById('translation');
        trans.innerHTML = explainText;
        trans.style.display = 'block';
    }

    initGame();
</script>
</body>
</html>
