<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>詩詞拼圖 - 靜夜思(李白)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; background-color: #fdf6e3; margin: 0; min-height: 100vh; box-sizing: border-box; }
        .full-width { width: 100%; max-width: 600px; text-align: center; margin-top: 5px; box-sizing: border-box; }
        
        #timer { position: fixed; top: 15px; right: 15px; font-size: 18px; font-weight: bold; color: #8b4513; background: white; padding: 5px 10px; border-radius: 10px; border: 2px solid #8b4513; z-index: 1000; }
        h2 { color: #8b4513; margin: 8px 0; font-size: 22px; }
        
        /* 首頁樣式優化 */
        #home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 10px; }
        .poetry-full-text { background: #fffaf0; border: 2px solid #d2b48c; padding: 15px; border-radius: 10px; margin: 20px 0; font-size: 18px; line-height: 2; color: #5d4037; font-weight: bold; width: 90%; max-width: 400px; word-wrap: break-word; white-space: pre-line; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        
        .start-btn { padding: 15px 30px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        
        /* 遊戲區域樣式 */
        .grid-container { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 10px 0; align-items: center; }
        .slot { width: 30px; height: 30px; border: 2px dashed #8b4513; display: flex; align-items: center; justify-content: center; background-color: #fff; border-radius: 6px; font-weight: bold; font-size: 15px; color: #333; }
        .punctuation { font-size: 16px; font-weight: bold; color: #5d6d7e; margin: 0 1px; }
        #tetris-container { width: 100%; max-width: 500px; height: 120px; background-color: #ffffff; border-radius: 8px; position: relative; overflow: hidden; margin-top: 5px; border: 2px solid #8b4513; }
        .tetris-block { position: absolute; display: flex; gap: 6px; justify-content: center; left: 50%; transform: translateX(-50%); transition: top 0.05s linear; width: 95%; }
        .tetris-word { width: 40px; height: 48px; background-color: #8b4513; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; font-weight: bold; border-radius: 8px; flex-shrink: 0; }
        
        #game-screen { display: none; }
    </style>
</head>
<body>

<div id="timer">時間：00:00</div>

<div id="home-screen" class="full-width">
    <h1>📜 詩詞拼圖遊戲</h1>
    <p style="font-size: 18px; margin: 10px 0;">李白：靜夜思</p>
    
    <div class="poetry-full-text">
        牀前明月光，
        疑是地上霜。
        舉頭望明月，
        低頭思故鄉。
    </div>

    <button class="start-btn" onclick="startGame()">開始遊戲</button>
</div>

<!-- (其餘邏輯程式碼保持不變) -->
<div id="game-screen" class="full-width">
    <h2>李白：靜夜思</h2>
    <div id="slots" class="grid-container"></div>
    <div id="tetris-container"></div>
    <div id="explanation"></div>
    <div class="btn-group">
        <button id="undo-btn" class="action-btn" onclick="undoLast()">⟲ 更正</button>
        <button id="reset-btn" class="action-btn" onclick="resetGame()">再玩一次</button>
    </div>
</div>

<script>
    // 保持原本的 JavaScript 邏輯不變...
    // (將您原本的 script 區塊完整貼回這裡)
</script>
</body>
</html>
