<script>
        document.addEventListener('DOMContentLoaded', function() {
            const games = [
                { name: "1.從軍行 (王昌齡 / 唐)", file: "join-army-1.html" },
                { name: "2.秋夕 (杜牧 / 唐)", file: "autumn-night-1.html" },
                { name: "3.送友人 (李白 / 唐)", file: "bidding-farewell-1.html" },
                { name: "4.金縷衣 (杜秋娘 / 唐)", file: "golden-dress-1.html" },
                { name: "5.夜雨寄北 (李商隱 / 唐)", file: "night-rain-1.html" }, // <-- 這裡原本少了一個逗號
                { name: "6.相見歡 (李煜 / 唐)", file: "happy-meeting.html" }
            ];

            const listElement = document.getElementById('game-list');
            
            games.forEach(game => {
                const li = document.createElement('li');
                li.innerHTML = '<div class="box game-link"><a href="' + game.file + '">' + game.name + '</a></div>';
                listElement.appendChild(li);
            });
        });
    </script>
